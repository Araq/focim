name: CI

# Compiles and runs the test suite on the three desktop platforms, and builds
# the editor itself once per platform as the last step of `tests/tester.nim`.
# Nothing here opens a window: the tests watch the drawing path through stub
# relays, so they need no display and no X server. The workflow that ships a
# binary -- and does open a window to check it -- is release.yml, which runs
# for tags only.

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Set `core.autocrlf` to false
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Nim
        uses: alaviss/setup-nim@0.1.1
        with:
          version: devel
          path: 'nim'

      - name: Nim version
        run: nim --version

      # No -dev packages on Linux: the X11 driver reaches libX11 and libXft
      # through `dynlib`, so nothing X11 is needed to compile, and the tests
      # never load a driver at all.
      - name: Install uirelays
        # It is not on the Nimble package list, so it is installed by URL --
        # which is the same dependency `focim.nimble` declares.
        run: nimble install -y https://github.com/nim-lang/uirelays

      - name: Run tests
        run: nim c -r tests/tester.nim
